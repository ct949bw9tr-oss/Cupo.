<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Boletas para los mejores planes de Barranquilla. Compra, recibe tu QR y pásale boletas a tus amigos.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cupo">
<meta property="og:title" content="Throwback 2016-2018 · Salvaje · 22 dic">
<meta property="og:description" content="Day party con DJ Phantom, 5 PM a 1 AM, 2x1 en cócteles. Compra tu boleta en Cupo.">
<meta property="og:image" content="https://cupo-beryl.vercel.app/covers/og-throwback-22dic.jpg">
<meta property="og:image:secure_url" content="https://cupo-beryl.vercel.app/covers/og-throwback-22dic.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="640">
<meta property="og:image:height" content="800">

<title>Cupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Cupo — noche barranquillera: negro profundo, acento lima de la marca, tipografía ancha de cartel. */
:root{
  --bg:#07070a;--card:#111115;--card2:#1a1a20;--card3:#22222a;--line:#25252d;--line2:#34343f;
  --txt:#f6f6f1;--mut:#9b9ba8;--dim:#6c6c78;--hot:#f6f6f1;
  --acc:#c8ff3d;--acc-ink:#0c1200;--acc-soft:rgba(200,255,61,.12);
  --sun:#ffc531;--ok:#3ddc97;--bad:#ff6b6b;
  --r:22px;--rs:14px;
  --fd:"Archivo","Inter Tight",Inter,system-ui,sans-serif;
  --fb:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.disp{font-family:var(--fd);font-stretch:112%;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{font-size:24px;line-height:1.1}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.i{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}

/* Formularios: 16px para que iOS no haga zoom */
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;width:100%;appearance:none;-webkit-appearance:none;transition:border-color .15s,background-color .15s}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=checkbox]{appearance:auto;-webkit-appearance:auto;width:18px;height:18px;accent-color:var(--acc);flex:none}
input[type=file]{padding:11px;font-size:14px;color:var(--mut)}
input[type=file]::file-selector-button{font:600 13px var(--fb);background:var(--card3);color:var(--txt);border:1px solid var(--line2);border-radius:99px;padding:8px 14px;margin-right:12px;cursor:pointer}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--card)}
textarea{resize:vertical;line-height:1.5}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:16px 0 7px}

/* Estructura */
.wrap{max-width:560px;margin:0 auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 28px max(18px,env(safe-area-inset-left,0px));position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));max-width:none;margin:0 auto;background:linear-gradient(to bottom,rgba(7,7,10,.92),rgba(7,7,10,.72));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.05)}
header.top>*{position:relative}
.top-in{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--fd);font-stretch:125%;font-weight:900;font-size:25px;letter-spacing:-.04em;text-decoration:none;color:var(--txt);display:inline-flex;align-items:baseline;line-height:1}
.logo::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:3px;box-shadow:0 0 14px rgba(200,255,61,.7)}
.pill{font-size:14px;padding:9px 16px;border-radius:99px;background:var(--txt);color:#000;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7dff9a);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;text-decoration:none;font-size:16px;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line2)}
.demobar{max-width:560px;margin:10px auto 0;padding:0 18px;position:relative;z-index:2}
.demobar div{background:var(--acc-soft);border:1px solid rgba(200,255,61,.3);color:#dcff8a;border-radius:12px;padding:9px 12px;font-size:12px}

/* Barra de pestañas */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,13,.86);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs a{color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;min-width:64px;text-decoration:none;font-weight:600;border-radius:14px;transition:color .15s}
nav.tabs svg{width:24px;height:24px}
nav.tabs a.on{color:var(--txt)}
nav.tabs a.on svg{color:var(--acc)}
nav.tabs a:hover{color:var(--txt)}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;background:var(--acc);color:var(--acc-ink);font-weight:700;padding:15px 20px;min-height:50px;border-radius:99px;width:100%;font-size:15px;letter-spacing:-.005em;transition:transform .12s var(--ease),filter .15s,background-color .15s,border-color .15s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--line2);background:var(--card3);filter:none}
.btn.sm{width:auto;padding:9px 15px;min-height:40px;font-size:13px;display:inline-flex}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none}
.btn .i{width:17px;height:17px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.card h3{font-size:17px;font-stretch:105%}
.sec{margin-top:30px}.sec>h3{font-size:19px;margin-bottom:10px}

/* Explorar */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.ev{display:block;text-decoration:none;color:inherit;margin:16px 0 22px;border-radius:var(--r)}
.ev .cov{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.ev:hover .cov{transform:translateY(-3px);box-shadow:0 22px 50px -18px rgba(0,0,0,.9)}
.cov{aspect-ratio:4/5;border-radius:var(--r);position:relative;display:flex;align-items:flex-end;padding:20px;background-size:cover;background-position:center;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cov::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 60% at 50% 120%,rgba(0,0,0,.55),transparent 60%);pointer-events:none}
.cov h3{font-size:34px;font-stretch:118%;line-height:.95;letter-spacing:-.035em;text-shadow:0 2px 24px rgba(0,0,0,.35);max-width:92%;text-transform:uppercase}
.cov.has-img h3{display:none}
.datebadge{position:absolute;top:14px;right:14px;width:56px;padding:7px 0 8px;border-radius:14px;background:rgba(255,255,255,.94);color:#0b0b0e;text-align:center;font-family:var(--fd);line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.datebadge small{display:block;font:700 10px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#d0213a}
.datebadge b{display:block;font-size:24px;font-weight:800;font-stretch:110%;margin-top:3px}
.ev .meta{padding:14px 2px 0}
.ev .when{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ev .ttl{font-family:var(--fd);font-stretch:110%;font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.ev .sub{color:var(--mut);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.ev .sub>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ev .sub b{color:var(--txt);font-weight:600;white-space:nowrap;font-size:13px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.mini .cov{aspect-ratio:auto;height:128px;padding:16px}.mini .cov h3{font-size:22px}
.tag{position:absolute;top:14px;left:14px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.12)}
.tag .i{width:13px;height:13px;vertical-align:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -18px 4px;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;min-height:40px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut);transition:all .15s}
.chips button:hover{color:var(--txt);border-color:var(--line2)}
.chips button.on{background:var(--txt);color:#000;border-color:var(--txt)}
.chips button .i{width:15px;height:15px}
.sk{border-radius:var(--r);background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
.sk.cov{aspect-ratio:4/5}.sk.l{height:14px;border-radius:7px;margin-top:12px}
@keyframes sk{to{background-position:-200% 0}}

/* Página del evento */
.backdrop{position:fixed;top:0;left:0;right:0;height:75vh;z-index:0;background-size:cover;background-position:center;filter:blur(80px) saturate(1.5);opacity:.5;transform:scale(1.25);pointer-events:none}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,var(--bg) 92%)}
.poster{margin-top:8px;border-radius:var(--r);box-shadow:0 40px 90px -20px rgba(0,0,0,.85)}
.evtitle{font-size:34px;line-height:1;margin-top:8px;letter-spacing:-.035em}
.evtitle.dup{display:none}
.evhead{margin-top:16px}
.evhead .kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.infos{margin-top:14px;background:rgba(17,17,21,.72);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.info{display:flex;gap:14px;align-items:center;padding:13px 0}
.info+.info{border-top:1px solid var(--line)}
.info .ic{width:46px;height:46px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--txt)}
.info .ic .i{width:20px;height:20px}
.info .ic.date{flex-direction:column;font-size:10px;font-weight:700;line-height:1.05;color:#d0213a;text-transform:uppercase;letter-spacing:.06em;background:#f6f6f1;border-color:#f6f6f1}
.info .ic.date b{font-family:var(--fd);font-size:19px;color:#0b0b0e;letter-spacing:-.02em}
.info .ic.host{background:var(--txt);color:#000;font-family:var(--fd);font-weight:800;font-size:18px}
.info .t1{font-weight:600}.info .t2{color:var(--mut);font-size:13px}
.info>div:last-child{min-width:0}
.desc{color:#d6d6dc;white-space:pre-line;margin-top:6px;font-size:15.5px;line-height:1.65;max-width:62ch}
.cta{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:15;padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 55%,transparent)}
.cta .in{max-width:524px;margin:0 auto;display:flex;align-items:center;gap:14px;background:rgba(26,26,32,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:99px;padding:7px 7px 7px 22px;box-shadow:0 18px 40px -12px rgba(0,0,0,.8)}
.cta .in>div{flex:1;min-width:0}.cta small{color:var(--mut);font-size:12px;display:block}.cta b{font-family:var(--fd);font-stretch:108%;font-size:18px;letter-spacing:-.02em}
.cta .btn{width:auto;padding:13px 24px;flex:none}

/* Selección de boletas */
.tier{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:18px;margin:10px 0;background:var(--card2);transition:border-color .15s}
.tier.sel{border-color:var(--acc);background:linear-gradient(0deg,var(--acc-soft),var(--acc-soft)),var(--card2)}
.tier>div:first-child{min-width:0}
.tier b{font-size:16px}
.tier .price{font-family:var(--fd);font-stretch:108%;font-weight:800;font-size:17px;margin-top:2px;letter-spacing:-.01em}
.tier.dim{opacity:.55}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mut);margin-top:4px}
.st.hot{color:var(--sun)}.st.ok{color:var(--ok)}
.st .i{width:13px;height:13px;vertical-align:0}
.qty{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.qty span{min-width:18px;text-align:center;font-size:17px}
.qty button{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .12s}
.qty button:last-child{background:var(--txt);color:#000;border-color:var(--txt)}
.qty button:active{transform:scale(.92)}
.sum{font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut)}
.sum div.t{color:var(--txt);font-weight:700;font-size:18px;border-top:1px dashed var(--line2);margin-top:8px;padding-top:14px}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--dim);margin-top:12px}
.secure .i{width:14px;height:14px}

/* Estadísticas */
.stat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.stat .card{margin:0;padding:16px}
.stat small{color:var(--mut);font-size:12px;font-weight:500}.stat .n{font-family:var(--fd);font-stretch:108%;font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(18px,5.6vw,24px)}
.bar{height:6px;border-radius:9px;background:var(--card3);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}

/* Boletas */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin:18px 0;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.ticket .h{padding:20px;background-size:cover;background-position:center;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.ticket .h h3{font-size:24px;line-height:1.02;text-transform:uppercase;letter-spacing:-.03em}
.ticket .ty{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:auto;color:#fff}
.ticket .q{padding:20px;display:flex;gap:18px;align-items:center;position:relative;border-top:2px dashed var(--line2)}
.ticket .q::before,.ticket .q::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .q::before{left:-13px}.ticket .q::after{right:-13px}
.ticket .qr{background:#fff;padding:9px;border-radius:16px;flex:none;line-height:0;width:138px;height:138px}
.ticket .qr img,.ticket .qr canvas{display:block}
.paybox{background:#111115;border:1px solid var(--line);border-radius:var(--r);padding:6px;min-height:220px;margin-top:14px}
.paynote{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:12.5px;color:var(--mut)}
.paynote svg{width:16px;height:16px;flex:none;margin-top:1px}
.wallet{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 20px 4px;min-height:50px;border-radius:12px;background:#000;color:#fff;text-decoration:none;border:1px solid #3a3a42;font-weight:600;font-size:17px;line-height:1.05;letter-spacing:-.01em}
.wallet small{display:block;font-size:11px;font-weight:500;opacity:.85}
.wallet svg{width:26px;height:26px}
.ticket .acts{display:flex;gap:8px;padding:0 20px 20px}
.ticket .acts>*{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.code{font-family:var(--fm);font-size:13px;letter-spacing:.04em;font-weight:500}
.muted{color:var(--mut)}.small{font-size:13px}.hide{display:none!important}

/* Editor */
.tierEdit{display:grid;grid-template-columns:1.1fr 1.2fr .75fr 38px;gap:8px;margin-bottom:8px;align-items:center}
.tierEdit button{background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:12px;height:48px}
.tierEdit button:hover:not(:disabled){color:var(--bad);border-color:var(--bad)}
.tierEdit button:disabled{opacity:.35;cursor:not-allowed}
.tierBox{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.tierBox input,.tierBox select{background:var(--bg)}
.tierBox .tierEdit{margin-bottom:6px;grid-template-columns:1.3fr 1fr 48px}
.tierBox .tl{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:0 0 5px}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.stage label{margin:4px 0 4px;font-size:11px}
.chkrow{display:flex!important;gap:10px;align-items:center;color:var(--txt)!important;font-size:14px!important;cursor:pointer}

/* Mapa y música */
.map{width:100%;height:220px;border:0;border-radius:16px;margin-top:12px;background:var(--card2);filter:grayscale(.15) contrast(1.05)}
.mapph{height:150px;border-radius:16px;margin-top:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--card2);border:1px dashed var(--line2);color:var(--mut);font-size:13px;text-align:center;padding:12px}
.mapph .i{width:24px;height:24px;color:var(--txt)}
.spot{width:100%;border:0;border-radius:14px;margin-top:12px}

<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/" id="logo" aria-label="Cupo, inicio">cupo</a>
  <span id="me"></span>
</div></header>
<div class="demobar" id="demoBar" hidden><div>Vista de prueba · entra con cualquier número y el código <b>123456</b> · no se cobra plata real</div></div>
<main class="wrap" id="app"><div class="spin"></div></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ================================================================
   CUPO — app de boletería
   ================================================================ */
const CFG = window.CUPO_CONFIG || {};
const APP = CFG.APP_NAME || 'Cupo';
const TZ = 'America/Bogota';
document.title = APP + ' — Boletas';
document.getElementById('logo').textContent = APP.toLowerCase();

if (CFG.DEMO) { const db=document.getElementById('demoBar'); if (db) db.hidden=false; }

/* Íconos (trazo de 24px) */
const ICO = {
  wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M3 13h18"/><path d="M16 17h2"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  nav:'<path d="M3 11 21 3l-8 18-2-8z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  play:'<path d="M7 4v16l13-8z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  share:'<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  hourglass:'<path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/>',
  send:'<path d="M7 17 17 7M8 7h9v9"/>',
  ticket:'<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v2M13 11v2M13 16v2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  wallet:'<path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15v-6"/><path d="M18 11h3v4h-3a2 2 0 0 1 0-4z"/>',
  chat:'<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
};
const icon = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]||''}</svg>`;
const orb = (n, kind) => `<div class="orb ${kind}">${icon(n)}</div>`;
const dateBadge = iso => { const d=new Date(iso); return `<div class="datebadge"><small>${d.toLocaleString('es-CO',{timeZone:TZ,month:'short'}).replace('.','')}</small><b>${d.toLocaleString('es-CO',{timeZone:TZ,day:'numeric'})}</b></div>`; };

const PALETTES = {
  neon:{name:'Neón',a:'#ff3d7f',b:'#6a2cff',c:'#0b0a10',txt:'#ffffff'},
  caribe:{name:'Caribe',a:'#ffb627',b:'#18d6c3',c:'#ff5e3a',txt:'#1a0f00'},
  noche:{name:'Noche',a:'#1c1c2e',b:'#000000',c:'#d4af37',txt:'#f5e6b8'},
  carnaval:{name:'Carnaval',a:'#e6007e',b:'#ffd400',c:'#00a651',txt:'#ffffff'},
};

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const app = () => $('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const fmtDate = iso => new Date(iso).toLocaleString('es-CO',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const datePart = iso => new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const timePart = iso => new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));
const toISO = (d,t) => `${d}T${t||'21:00'}:00-05:00`; // Colombia no tiene horario de verano
const siteURL = () => location.origin + location.pathname.replace(/index\.html$/,'');
const eventURL = (slug, code) => siteURL() + '#/e/' + slug + (code ? '/' + code : '');
const orderURL = (id, k) => siteURL() + '#/orden/' + id + '/' + k;

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2400); }
function modal(html){ $('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('modalRoot').innerHTML=''; }
async function copy(s){ try{ await navigator.clipboard.writeText(s); toast('Copiado ✓'); }catch(e){ modal(`<h3>Copia este texto</h3><input value="${esc(s)}" onclick="this.select()" style="margin-top:12px"><button class="btn alt" style="margin-top:12px" onclick="closeModal()">Listo</button>`); } }
function coverStyle(e){
  const p = PALETTES[e.palette] || PALETTES.neon;
  if (e.cover_url) return `background-image:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.1)),url('${esc(e.cover_url)}')`;
  return `background:radial-gradient(circle at 20% 20%,${p.b},transparent 60%),linear-gradient(135deg,${p.a},${p.c})`;
}
const minPrice = e => { const open=(e.ticket_types||[]).filter(t=>(t.state||'open')==='open'&&t.available!==0); const l=open.length?open:(e.ticket_types||[]); return l.length?Math.min(...l.map(t=>t.price)):0; };
const CAN_EMBED = !CFG.DEMO;
const mapQuery = e => [e.address, e.venue, e.city].filter(Boolean).join(', ');
const dirURL = e => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(mapQuery(e));
function spotifyEmbed(url){
  const m = String(url||'').match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|track|album|artist|episode|show)\/([A-Za-z0-9]+)/);
  return m ? { type:m[1], url:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`, open:`https://open.spotify.com/${m[1]}/${m[2]}` } : null;
}
function locationCard(e, forBuyer){
  const hidden = e.hide_address && !e.address;
  return `<div class="card"><h3>Ubicación</h3>
    <div class="locline">${icon('pin')}<span><b>${esc(e.venue)}</b>${e.address?' · '+esc(e.address):''}${e.city?', '+esc(e.city):''}</span></div>
    ${hidden ? `<div class="mapph">${icon('lock')}<b style="color:var(--txt)">Dirección privada</b>Te llega con tu boleta apenas compres.</div>`
      : (CAN_EMBED ? `<iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(mapQuery(e))}&output=embed"></iframe>`
                   : `<div class="mapph">${icon('pin')}<b style="color:var(--txt)">Mapa de Google</b>${esc(mapQuery(e))}</div>`)}
    ${hidden ? '' : `<a class="btn alt" style="margin-top:10px" target="_blank" href="${dirURL(e)}">${icon('nav')} Cómo llegar</a>`}
  </div>`;
}
function musicCard(e){
  const sp = spotifyEmbed(e.spotify_url); if (!sp) return '';
  const h = ['track','episode'].includes(sp.type) ? 152 : 352;
  return `<div class="card"><h3 style="display:flex;align-items:center;gap:8px">${icon('music')} La música</h3><p class="small muted" style="margin-top:2px">Así va a sonar la noche.</p>
    ${CAN_EMBED ? `<iframe class="spot" style="height:${h}px" src="${sp.url}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
      : `<a class="btn" style="margin-top:10px;background:#1db954;color:#000" target="_blank" href="${sp.open}">${icon('play')} Escuchar en Spotify</a>`}</div>`;
}
function tierStatus(t){
  const st = t.state || 'open';
  if (st==='ended') return { ok:false, tone:'', label:'Venta cerrada' };
  if (st==='locked') return { ok:false, tone:'', label:`${icon('lock')} Se abre cuando se agote ${esc(t.unlock_after_name||'la etapa anterior')}` };
  if (t.available<=0) return { ok:false, tone:'', label:'Agotado' };
  const until = t.sales_end ? ' · hasta ' + new Date(t.sales_end).toLocaleDateString('es-CO',{timeZone:TZ,day:'numeric',month:'short'}) : '';
  return { ok:true, tone:t.available<=20?'hot':'ok', label:(t.available<=20?`Quedan ${t.available}`:'Disponible') + until };
}
const loading = () => app().innerHTML = '<div class="spin" role="status" aria-label="Cargando"></div>';
function localOrders(){ try{ return JSON.parse(localStorage.getItem('cupo_orders')||'[]'); }catch(e){ return []; } }
function rememberOrder(o){ try{ const l=localOrders().filter(x=>x.id!==o.id); l.unshift(o); localStorage.setItem('cupo_orders', JSON.stringify(l.slice(0,30))); }catch(e){} }

/* ---------- Supabase ---------- */
if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
  app().innerHTML = `<div class="card narrow"><h2>Falta configurar</h2><p class="muted" style="margin-top:8px">Abre <b>config.js</b> y pon la URL y la llave de tu proyecto de Supabase. Los pasos están en la guía (LEEME.md).</p></div>`;
  throw new Error('config');
}
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let session = null, profile = null;

async function loadSession(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  profile = null;
  if (session) {
    const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    profile = p;
  }
  renderMe();
}
function renderMe(){
  const el = $('me'); if (!el) return;
  if (session) { const n = (profile?.name || '').trim(); el.innerHTML = `<a class="avatar" href="#/panel" title="Perfil">${esc((n[0]||'🙂').toUpperCase())}</a>`; }
  else el.innerHTML = `<a class="pill" href="#/login">Entrar</a>`;
}
let booted = false;
sb.auth.onAuthStateChange((ev) => {
  if (ev !== 'SIGNED_OUT') return;
  setTimeout(async () => { await loadSession(); if (booted) { location.hash = '#/'; route(); } }, 0);
});
const myEmail = () => (session?.user?.email || '').trim().toLowerCase();
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const OTP_LEN = CFG.OTP_LENGTH || 6;
const fmtPhone = p => { p = String(p||'').replace(/\D/g,''); if (p.startsWith('57') && p.length===12) return '+57 ' + p.slice(2,5) + ' ' + p.slice(5,8) + ' ' + p.slice(8); return p ? '+' + p : ''; };
const waLink = (phone, text) => `https://wa.me/${String(phone).replace(/\D/g,'')}?text=${encodeURIComponent(text)}`;

/* ---------- navegación ---------- */
const ICONS = {
  '':'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  boletas:'<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/>',
  nuevo:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  panel:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'
};
function renderTabs(cur){
  const t=[['','Explorar'],['boletas','Boletas'],['nuevo','Crear'],['panel','Perfil']];
  $('tabs').innerHTML = t.map(([k,l])=>`<a href="#/${k}" class="${cur===k?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${cur===k?2.4:1.8}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</a>`).join('');
}
function setBackdrop(style){ let b=$('backdrop'); if(!style){ if(b) b.remove(); return; } if(!b){ b=document.createElement('div'); b.id='backdrop'; b.className='backdrop'; document.body.prepend(b); } b.setAttribute('style', style); }
function setCTA(html){ let c=$('cta'); if(!html){ if(c) c.remove(); return; } if(!c){ c=document.createElement('div'); c.id='cta'; c.className='cta'; document.body.appendChild(c); } c.innerHTML=`<div class="in">${html}</div>`; }

let stopScanner = null;
async function route(){
  if (stopScanner) { try{ await stopScanner(); }catch(e){} stopScanner = null; }
  closeModal(); setBackdrop(null); setCTA(null);
  const qs = new URLSearchParams(location.search);
  if (qs.get('mp')) {   // regreso desde Mercado Pago al conectar la cuenta
    const r = qs.get('mp');
    toast(r==='ok' ? 'Mercado Pago conectado ✓' : r==='expired' ? 'La conexión tardó mucho. Intenta otra vez.' : 'No se pudo conectar Mercado Pago. Intenta otra vez.');
    history.replaceState(null, '', location.pathname + location.hash);
  }
  if (qs.get('o') && qs.get('k') && location.hash === '') { renderTabs('boletas'); return vOrder(qs.get('o'), qs.get('k'), qs.get('payment_id') || qs.get('collection_id'), qs.get('ref_payco'), qs.get('bold-order-id')); }
  const [a,b,c] = location.hash.replace(/^#\/?/,'').split('/');
  app().classList.toggle('narrow', !['','e'].includes(a||''));
  renderTabs(a==='e'?'':(['flyer','editar','scan','evento','admin','login'].includes(a)?'panel':a||''));
  window.scrollTo(0,0);
  try {
    switch(a||''){
      case '': return await vExplore();
      case 'e': return await vEvent(b, c);
      case 'boletas': return await requireAuth(()=>vMyTickets());
      case 'orden': renderTabs('boletas'); return await vOrder(b, c, null);
      case 'login': return vLogin();
      case 'nuevo': return await requireAuth(()=>vEdit(null));
      case 'editar': return await requireAuth(()=>vEdit(b));
      case 'panel': return await requireAuth(()=>vPanel());
      case 'evento': return await requireAuth(()=>vDashboard(b));
      case 'flyer': return await requireAuth(()=>vFlyer(b));
      case 'scan': return await requireAuth(()=>vScan(b));
      case 'admin': return await requireAuth(()=>vAdmin());
      default: location.hash = '#/';
    }
  } catch(err) {
    console.error(err);
    app().innerHTML = `<div class="empty"><div class="orb bad">${icon('alert')}</div><b>Algo salió mal</b><p class="small">${esc(err.message||err)}</p><button class="btn sm alt" onclick="route()">Intentar otra vez</button></div>`;
  }
}
window.addEventListener('hashchange', route);
function afterLogin(){ let to = null; try { to = sessionStorage.getItem('cupo_after'); sessionStorage.removeItem('cupo_after'); } catch(e){} return to || '#/boletas'; }
async function requireAuth(fn){
  if (!session) { try{ sessionStorage.setItem('cupo_after', location.hash || '#/'); }catch(e){} return vLogin(); }
  if (!profile?.name) return vName();
  return fn();
}

let LOGIN_EMAIL = '';
function vLogin(){
  renderTabs('panel');
  app().innerHTML = `<div class="hero" style="margin-top:28px"><h1>Entra con tu correo</h1><p>Te mandamos un código a tu correo. Tus boletas quedan guardadas en tu cuenta.</p></div>
  <form onsubmit="event.preventDefault();sendCode()" style="margin-top:22px">
    <label for="em" style="margin-top:0">Correo electrónico</label>
    <input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="tucorreo@gmail.com" value="${esc(LOGIN_EMAIL)}" required>
    <button class="btn" id="lBtn" style="margin-top:16px">Enviarme el código</button>
  </form>
  <p class="note" style="text-align:center;margin-top:14px">Al entrar aceptas los términos y la política de datos de ${esc(APP)}.</p>`;
  setTimeout(()=>$('em')?.focus(), 50);
}
async function sendCode(){
  const email = $('em').value.trim().toLowerCase();
  if (!EMAIL_RE.test(email)) return toast('Revisa tu correo');
  LOGIN_EMAIL = email;
  $('lBtn').disabled = true; $('lBtn').textContent = 'Enviando…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if (error) { toast(/rate|seconds|minute/i.test(error.message) ? 'Espera un minuto e intenta otra vez' : 'No se pudo enviar el código'); $('lBtn').disabled=false; $('lBtn').textContent='Enviarme el código'; return; }
  app().innerHTML = `<div class="hero" style="margin-top:20px"><h1>Escribe el código</h1><p>Lo enviamos a <b style="color:var(--txt)">${esc(LOGIN_EMAIL)}</b>. Si no lo ves, revisa Spam o Promociones.</p></div>
  <form onsubmit="event.preventDefault();verifyCode()" style="margin-top:22px">
    <input id="otp" class="otp" aria-label="Código de ${OTP_LEN} dígitos" inputmode="numeric" autocomplete="one-time-code" maxlength="${OTP_LEN}" placeholder="${'•'.repeat(OTP_LEN)}" required oninput="if(this.value.replace(/\D/g,'').length===${OTP_LEN})verifyCode()">
    <button class="btn" id="vBtn" style="margin-top:16px">Entrar</button>
    <button type="button" class="btn alt" style="margin-top:10px" onclick="vLogin()">Cambiar correo</button>
  </form>`;
  setTimeout(()=>$('otp')?.focus(), 50);
}
let verifying = false;
async function verifyCode(){
  if (verifying) return; verifying = true;
  const token = $('otp').value.replace(/\D/g,'');
  $('vBtn').disabled = true;
  const { error } = await sb.auth.verifyOtp({ email: LOGIN_EMAIL, token, type: 'email' });
  verifying = false;
  if (error) { toast('Código incorrecto o vencido'); $('vBtn').disabled=false; $('otp').value=''; return; }
  await loadSession();
  if (!profile?.name) return vName();
  toast('¡Hola, ' + profile.name.split(' ')[0] + '!');
  location.hash = afterLogin(); route();
}
function vName(){
  app().innerHTML = `<div class="hero" style="margin-top:20px"><h1>¿Cómo te llamas?</h1><p>Este nombre sale en tus boletas.</p></div>
  <form onsubmit="event.preventDefault();saveName()" style="margin-top:22px">
    <input id="nm" autocomplete="name" placeholder="Nombre y apellido" required minlength="3">
    <button class="btn" style="margin-top:16px">Continuar</button></form>`;
}
async function saveName(){
  const name = $('nm').value.trim(); if (name.length < 3) return toast('Escribe tu nombre completo');
  const { error } = await sb.from('profiles').update({ name }).eq('id', session.user.id);
  if (error) return toast(error.message);
  await loadSession(); location.hash = afterLogin(); route();
}

  <div class="chips">${[['all','Todos'],['week','Esta semana'],['month','Este mes']].map(([k,l])=>`<button class="${FILTER===k?'on':''}" onclick="FILTER='${k}';drawExplore()">${l}</button>`).join('')}
    <button onclick="askCode()">${icon('lock')} Tengo un código</button></div>
  ${list.length ? `<div class="grid">${list.map(evCard).join('')}</div>` : `<div class="empty"><div class="orb">${icon('calendar')}</div><b>Nada por ahora</b>No hay eventos en estas fechas todavía.${FILTER!=='all'?`<button class="btn sm alt" onclick="FILTER='all';drawExplore()">Ver todos los eventos</button>`:''}</div>`}`;

  if (error) throw error;
  if (!e) { app().innerHTML = '<div class="empty">Este evento no existe o ya no está disponible.</div>'; return; }
  if (e.locked) {
    app().innerHTML = `<div class="narrow"><div class="hero c">${orb('lock','mute')}<h1>${esc(e.name)}</h1>
      <p>Evento privado. Escribe el código que te dieron.</p></div>

      <button class="btn" style="margin-top:14px">Entrar</button></form></div>`;

  setBackdrop(coverStyle(e));
  app().innerHTML = `
  <a class="back" href="#/">${icon('back')} Explorar</a>
  <div class="evpage">
  <div class="poster">${poster(e)}</div>
  <div class="evhead">
    <span class="kicker">${e.is_private?icon('lock')+' Evento privado':esc(e.city||CFG.CITY||'')}</span>
    <h1 class="evtitle ${e.cover_url?'':'dup'}">${esc(e.name)}</h1>
  </div>
  <div class="infos">
    <div class="info"><div class="ic date">${o({month:'short'}).replace('.','')}<b>${o({day:'numeric'})}</b></div><div><div class="t1">${cap1(o({weekday:'long'}))}, ${o({day:'numeric',month:'long'})}</div><div class="t2">${o({hour:'numeric',minute:'2-digit'})}</div></div></div>
    <div class="info"><div class="ic">${icon('pin')}</div><div><div class="t1">${esc(e.venue)}</div><div class="t2">${e.hide_address&&!e.address?'Dirección al comprar':esc([e.address,e.city].filter(Boolean).join(', '))}</div></div></div>
  </div>
  ${e.description?`<div class="sec"><h3>Sobre el evento</h3><p class="desc">${esc(e.description)}</p></div>`:''}
  <div>${musicCard(e)}</div>
  <div>${locationCard(e)}</div>
  <div><button class="btn alt" style="margin-top:14px" onclick="shareEvent()">${icon('share')} Compartir evento</button></div>
  </div>

  setCTA(anyOpen ? `<div><small>Desde</small><b>${COP(minPrice(e))}</b></div><button class="btn" onclick="openTickets()">Comprar boletas</button>`
                 : `<div><b>Agotado</b><small>No quedan boletas disponibles</small></div>`);
  if (resume && anyOpen && session) { try { CART = JSON.parse(resume) || {}; } catch(_){} openTickets(); }

function openTickets(){
  const e = EV;
  modal(`<h2>Boletas</h2><p class="muted small" style="margin-top:2px">${esc(e.name)} · ${whenLabel(e.starts_at)}</p>
    <div style="margin-top:14px">${e.ticket_types.map(t=>{const s=tierStatus(t);return `<div class="tier ${s.ok?'':'dim'} ${CART[t.id]?'sel':''}" id="tr_${t.id}">
      <div><b>${esc(t.name)}</b><div class="price">${COP(t.price)}</div><div class="st ${s.tone}">${s.label}</div></div>
      ${s.ok?`<div class="qty"><button onclick="setQty('${t.id}',-1)" aria-label="Quitar una ${esc(t.name)}">−</button><span id="q_${t.id}" aria-live="polite">${CART[t.id]||0}</span><button onclick="setQty('${t.id}',1)" aria-label="Agregar una ${esc(t.name)}">+</button></div>`:''}</div>`}).join('')}</div>
    <div class="sum" id="sum" style="margin-top:12px"></div>
    <button class="btn" id="buyBtn" style="margin-top:14px" onclick="startPayment()" disabled>Elige tus boletas</button>
    <div class="secure">${icon('shield')} Pago seguro con Mercado Pago · tarjeta o PSE</div>
    ${e.allow_transfers!==false?'<p class="note" style="text-align:center">Puedes pasarle boletas a tus amigos con su correo.</p>':''}`);
  updSum();
}
function setQty(id, d){
  const t = EV.ticket_types.find(x=>x.id===id);
  const total = Object.values(CART).reduce((a,b)=>a+b,0);
  if (d>0 && total>=10) return toast('Máximo 10 boletas por compra');
  CART[id] = Math.max(0, Math.min((CART[id]||0) + d, t.available));
  $('q_'+id).textContent = CART[id]; $('tr_'+id)?.classList.toggle('sel', CART[id]>0); updSum();
}
let sumTimer;
function updSum(){
  const sub = EV.ticket_types.reduce((a,t)=>a+(CART[t.id]||0)*t.price,0);
  const n = Object.values(CART).reduce((a,b)=>a+b,0);
  const btn = $('buyBtn'); if (!btn) return;
  btn.disabled = n===0;
  if (!n) { $('sum').innerHTML = ''; btn.textContent = 'Elige tus boletas'; return; }
  clearTimeout(sumTimer);
  sumTimer = setTimeout(async ()=>{
    const { data } = await sb.rpc('calc_fees', { p_subtotal: sub, p_mode: EV.fee_mode });
    const f = data?.[0] || { total: sub }, service = f.total - sub;
    if (!$('sum')) return;
    $('sum').innerHTML = `<div><span>${n} boleta${n===1?'':'s'}</span><span>${COP(sub)}</span></div>
      ${service>0?`<div><span>Cargo por servicio</span><span>${COP(service)}</span></div>`:''}
      <div class="t"><span>Total</span><span>${COP(f.total)}</span></div>`;
    btn.textContent = 'Pagar ' + COP(f.total);
  }, 120);
}
function shareEvent(){
  const url = eventURL(EV.slug, EV_CODE);
  if (navigator.share) navigator.share({ title: EV.name, url }).catch(()=>{}); else copy(url);
}
/* Compra como invitado: sin cuenta, solo nombre y correo (las boletas quedan a ese correo) */
let GUEST = null;
try { GUEST = JSON.parse(localStorage.getItem('cupo_guest') || 'null'); } catch(e) {}
function goLoginToBuy(){

  closeModal(); setCTA(null); setBackdrop(null); vLogin();

function openGuest(){
  const g = GUEST || { name:'', email:'' };
  modal(`<h2>¿A nombre de quién?</h2><p class="muted small" style="margin-top:4px">No necesitas cuenta. Tu boleta con QR te sale apenas pagues.</p>
  <form onsubmit="event.preventDefault();guestContinue()">

    <p class="note">Revisa bien el correo: con él puedes volver a ver tus boletas cuando quieras.</p>
    <button class="btn" id="gBtn" style="margin-top:14px">Continuar al pago</button></form>
  <button class="btn alt" style="margin-top:10px" onclick="goLoginToBuy()">Ya tengo cuenta: entrar con mi correo</button>`);
  setTimeout(()=>$('gName')?.focus(), 50);
}
function guestContinue(){
  const name = $('gName').value.trim().replace(/\s+/g,' '), email = $('gEm').value.trim().toLowerCase();
  if (name.length < 3 || !name.includes(' ')) return toast('Escribe tu nombre y apellido');
  if (!EMAIL_RE.test(email)) return toast('Revisa el correo');
  GUEST = { name, email }; try { localStorage.setItem('cupo_guest', JSON.stringify(GUEST)); } catch(e){}
  startPayment();
}
async function startPayment(){
  if (!session) { if (!$('gBtn')) return openGuest(); }
  else if (!profile?.name) {
    try { sessionStorage.setItem('cupo_after', location.hash); sessionStorage.setItem('cupo_cart', JSON.stringify(CART)); } catch(e){}
    closeModal(); setCTA(null); setBackdrop(null); return vName();
  }
  const btn = $('buyBtn') || $('gBtn'); btn.disabled = true; btn.textContent = 'Un momento…';
  const items = Object.entries(CART).filter(([,q])=>q>0).map(([ticket_type_id,qty])=>({ticket_type_id,qty}));
  const buyer = session ? { name: profile.name } : { name: GUEST.name, email: GUEST.email };
  const { data, error } = await sb.functions.invoke('create-order', { body: { slug: EV.slug, code: EV_CODE, items, ...buyer } });
  let msg = data?.error;
  if (error && !msg) { try { msg = (await error.context.json()).error; } catch(e) { msg = 'No se pudo iniciar el pago.'; } }
  if (msg) { toast(msg); btn.disabled=false; if ($('buyBtn')) updSum(); else btn.textContent = 'Continuar al pago'; return; }
  rememberOrder({ id: data.orderId, k: data.token, name: EV.name, at: EV.starts_at });
  closeModal();
  if (!(CFG.DEMO && typeof WidgetCheckout !== 'undefined')) {
    if (!data.checkoutUrl) { toast('No se pudo iniciar el pago. Intenta otra vez.'); return; }
    if (CFG.BOLD_ON || /[?&]bold=1/.test(location.search)) { PAY = data; return payBold(); }   // Bold directo (Mercado Pago solo si Bold falla)
    if (CFG.MP_BRICK && (data.publicKey || CFG.MP_PUBLIC_KEY) && data.amount) return openPay(data);   // formulario dentro de Cupo (apagado: se paga en Mercado Pago)
    location.href = data.checkoutUrl; return;   // página de pago de Mercado Pago
  }
  // Solo en el demo: pago simulado
  const ph = '';
  const checkout = new WidgetCheckout({
    currency: data.currency, amountInCents: data.amountInCents, reference: data.reference,
    publicKey: data.publicKey, signature: { integrity: data.signature }, redirectUrl: data.redirectUrl,
    customerData: { fullName: profile.name, phoneNumber: ph.startsWith('57') ? ph.slice(2) : ph, phoneNumberPrefix: ph.startsWith('57') ? '+57' : undefined },
  });
  checkout.open(result => {
    const tx = result && result.transaction;
    location.hash = '#/orden/' + data.orderId + '/' + data.token;
  });
}

/* ================================================================
   CONFIRMACIÓN DE PAGO
   ================================================================ */
async function vOrder(id, k, txId, refPayco, boldRef){
  app().innerHTML = '<div class="spin" role="status"></div><p class="muted" style="text-align:center">Confirmando tu pago…</p>';
  if (txId) { try { await sb.functions.invoke('confirm-order', { body: { paymentId: txId, orderId: id, token: k } }); } catch(e){} }
  if (refPayco) { txId = refPayco; try { await sb.functions.invoke('epayco-confirm', { body: { ref_payco: refPayco } }); } catch(e){} }
  if (boldRef) { txId = boldRef; try { await sb.functions.invoke('bold', { body: { action: 'confirm', reference: boldRef } }); } catch(e){} }
  let o = null;
  for (let i=0;i<20;i++){
    const { data } = await sb.rpc('get_order', { p_order: id, p_token: k });
    o = data;
    if (!o || o.status !== 'pending' || !txId && i>0) break;
    await new Promise(r=>setTimeout(r, 3000));
  }
  if (!o) { app().innerHTML = `<div class="empty"><div class="orb">${icon('search')}</div><b>No encontramos esta compra</b>Revisa el link o busca tus boletas en "Boletas".<a class="btn sm alt" href="#/boletas">Ir a mis boletas</a></div>`; return; }
  if (o.status === 'failed') {
    app().innerHTML = `<div class="hero c">${orb('x','bad')}<h1>El pago no se completó</h1>
      <p>No se te cobró nada. Puedes intentarlo otra vez.</p></div><a class="btn" style="margin-top:20px" href="${siteURL()}#/e/${o.event.slug}">Volver al evento</a>`; return;
  }
  if (o.status === 'pending') {
    app().innerHTML = `<div class="hero c">${orb('hourglass','warn')}<h1>Pago en proceso</h1>
      <p>Si ya pagaste, tus boletas aparecen en "Boletas" en unos minutos.</p></div>
      <button class="btn" style="margin-top:20px" onclick="location.reload()">Actualizar</button>`; return;
  }
  const tix = o.tickets || [];
  app().innerHTML = `<div class="hero c">${orb('check','ok')}<h1>¡Estás dentro!</h1>
    <p>${o.qty} boleta${o.qty===1?'':'s'} para <b style="color:var(--txt)">${esc(o.event.name)}</b>.${session ? ` Quedaron guardadas en tu cuenta de ${APP}.` : ''}</p></div>
    ${tix.map((t,i)=>`<div class="ticket" style="margin-top:16px"><div class="q"><div class="qr" id="oqr_${i}"></div><div style="min-width:0">
      <div class="small muted">${esc(t.type_name)}</div><b style="font-size:16px">${esc(t.holder_name)}</b><div class="code" style="margin-top:8px">${esc(t.code)}</div>
      <div class="status" style="color:${t.checked_in_at?'var(--mut)':'var(--ok)'}">${t.checked_in_at?'Ya entró':'Lista para entrar'}</div></div></div></div>`).join('')}
    ${session

    if (!document.querySelector('script[data-mp-sec]')) { const sc = document.createElement('script'); sc.src = 'https://www.mercadopago.com/v2/security.js'; sc.setAttribute('view','checkout'); sc.setAttribute('output','deviceId'); sc.dataset.mpSec = '1'; document.head.appendChild(sc); }
    await loadScript(MP_SDK);
    const pk = data.publicKey || CFG.MP_PUBLIC_KEY;

async function renderBrick(){
  const box = $('payBox'); if (!box) return;
  if (BRICK) { try { BRICK.unmount(); } catch(e){} BRICK = null; }
  box.innerHTML = '';
  const nm = (profile?.name || GUEST?.name || '').trim().split(/\s+/);
  BRICK = await MPJS.bricks().create('payment', 'payBox', {
    initialization: { amount: PAY.amount, payer: { email: myEmail() || GUEST?.email || '', firstName: nm[0] || '', lastName: nm.slice(1).join(' ') } },
    customization: {
      paymentMethods: { creditCard: 'all', debitCard: 'all', maxInstallments: 12 },   // PSE va por la página de Mercado Pago
      visual: { style: { theme: 'dark', customVariables: {
        baseColor: '#c8ff3d', buttonTextColor: '#0c1200', formBackgroundColor: '#111115', inputBackgroundColor: '#1a1a20',
        textPrimaryColor: '#f4f4f6', textSecondaryColor: '#a1a1aa', outlinePrimaryColor: '#34343f', outlineSecondaryColor: '#25252d',
        borderRadiusSmall: '10px', borderRadiusMedium: '12px', borderRadiusLarge: '16px' } } },
    },
    callbacks: {
      onReady: () => {},
      onError: err => console.error('Brick', err),
      onSubmit: ({ formData }) => submitPay(formData),
    },
  });
}
async function submitPay(formData){
  if (PAYING) return; PAYING = true;
  let r = null;
  try {
    const { data, error } = await sb.functions.invoke('pay-order', { body: { orderId: PAY.orderId, token: PAY.token, formData, deviceId: window.MP_DEVICE_SESSION_ID || window.deviceId || '' } });
    r = data;
    if (error && !r?.error) { try { r = await error.context.json(); } catch(e) { r = { error: 'No se pudo procesar el pago.' }; } }
  } catch (e) { r = { error: 'Sin conexión. Revisa tu internet e intenta otra vez.' }; }
  finally { PAYING = false; }
  if (r?.redirectUrl) { location.href = r.redirectUrl; return; }           // PSE: página del banco
  if (r?.status === 'approved') return goOrder(r.paymentId);
  if (r?.challenge) return show3ds(r);                                     // verificación del banco
  if (r?.status === 'in_process' || r?.status === 'pending') return goOrder(r.paymentId);
  toast(r?.error || 'El pago no pasó. Intenta otra vez.');
  await renderBrick();                                                     // formulario limpio para reintentar
}

async function payBold(){

    const { data, error } = await sb.functions.invoke('bold', { body: { action: 'sign', orderId: PAY.orderId, token: PAY.token } });

function syncEd(){
  if (!$('f_name')) return;
  Object.assign(ED, { name:$('f_name').value, date:$('f_date').value, time:$('f_time').value, venue:$('f_venue').value, address:$('f_address').value, hide_address:$('f_hide').checked, allow_transfers:$('f_xfer').checked, spotify_url:$('f_spotify').value.trim(), city:$('f_city').value, description:$('f_desc').value });
  document.querySelectorAll('#tiers input, #tiers select').forEach(inp=>{ const t=ED.tiers[+inp.dataset.i], k=inp.dataset.k;
    if (k==='name' || k==='end_date') t[k] = inp.value; else if (k==='unlock_idx') t[k] = parseInt(inp.value); else t[k] = Math.max(0, parseInt(inp.value)||0); });
}
function rmTier(i){ syncEd(); if (ED.tiers.length<=1) return toast('Debe haber al menos un tipo'); const [t]=ED.tiers.splice(i,1); if(t.id) ED.removed.push(t.id);
  ED.tiers.forEach(x=>{ if (x.unlock_idx===i) x.unlock_idx=-1; else if (x.unlock_idx>i) x.unlock_idx--; }); drawEdit(); }
function addStage(){ syncEd(); const last=ED.tiers.length-1, p=ED.tiers[last]; const n=ED.tiers.filter(t=>/^etapa/i.test(t.name)).length+2;
  ED.tiers.push({ name:'Etapa '+n, price:Math.round((p.price*1.2)/5000)*5000||p.price, quantity:p.quantity, sold:0, unlock_idx:last, end_date:'' }); drawEdit(); }
async function pickCover(input){
  const f = input.files[0]; if (!f) return;
  syncEd(); toast('Subiendo foto…');
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(f); });
  const s = Math.min(1, 1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const path = `${session.user.id}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('covers').upload(path, blob, { contentType:'image/jpeg' });
  if (error) return toast('No se pudo subir: '+error.message);
  ED.cover_url = sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
  drawEdit(); toast('Foto lista ✓');
}
async function saveEvent(){
  syncEd(); const e = ED;
  if (e.name.trim().length < 2) return toast('Ponle nombre al evento');
  if (e.spotify_url && !spotifyEmbed(e.spotify_url)) return toast('Ese link de Spotify no sirve. Copia el enlace de una playlist o canción.');
  if (!e.date) return toast('Elige la fecha');
  for (const t of e.tiers) {
    if (!t.name.trim()) return toast('Cada boleta necesita nombre');
    if (t.price < 1000) return toast('El precio mínimo es $1.000');
    if (t.quantity < (t.sold||0)) return toast(`"${t.name}" no puede tener menos de ${t.sold} (ya vendidas)`);
  }
  $('saveBtn').disabled = true;
  const row = { name:e.name.trim(), starts_at:toISO(e.date,e.time), venue:e.venue.trim(), address:(e.address||'').trim(), hide_address:!!e.hide_address, allow_transfers:e.allow_transfers!==false, spotify_url:e.spotify_url||null, city:e.city.trim(), description:e.description.trim(),
                is_private:e.is_private, fee_mode:e.fee_mode, palette:e.palette||'neon', cover_url:e.cover_url };
  try {
    let id = e.id;
    if (id) { const { error } = await sb.from('events').update(row).eq('id', id); if (error) throw error; }
    else { const { data, error } = await sb.from('events').insert(row).select('id').single(); if (error) throw error; id = data.id; }
    for (const rid of e.removed) { const { error } = await sb.from('ticket_types').delete().eq('id', rid); if (error) throw error; }
    const ids = [];
    for (const [i,t] of e.tiers.entries()) {
      const tr = { name:t.name.trim(), price:t.price, quantity:t.quantity, sort:i, sales_end: t.end_date ? `${t.end_date}T23:59:00-05:00` : null };
      if (t.id) { const { error } = await sb.from('ticket_types').update(tr).eq('id', t.id); if (error) throw error; ids.push(t.id); }
      else { const { data, error } = await sb.from('ticket_types').insert({ ...tr, event_id:id }).select('id').single(); if (error) throw error; ids.push(data.id); }
    }
    for (const [i,t] of e.tiers.entries()) {   // etapas: se enlazan después de tener todos los ids
      const ua = t.unlock_idx>=0 && t.unlock_idx<i ? ids[t.unlock_idx] : null;
      const { error } = await sb.from('ticket_types').update({ unlock_after: ua }).eq('id', ids[i]); if (error) throw error;
    }
    ED = null; toast('Evento guardado ✅'); location.hash = '#/evento/' + id;
  } catch(err) { toast(err.message); $('saveBtn').disabled = false; }
}
function askDelete(){
  modal(`<h2>¿Eliminar "${esc(ED.name)}"?</h2><p class="muted" style="margin:8px 0 16px">Si ya vendiste boletas no se puede borrar; ocúltalo desde el panel.</p>
  <div class="row"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--bad)" onclick="doDelete()">Eliminar</button></div>`);
}
async function doDelete(){ const { error } = await sb.from('events').delete().eq('id', ED.id); closeModal(); if (error) return toast(error.message); ED=null; location.hash='#/panel'; }

/* ================================================================
   FLYER
   ================================================================ */
let FL = { layout:'bold', tag:'' }, FLE = null;
async function vFlyer(id){
  loading();
  const { data, error } = await sb.from('events').select('*, ticket_types(price)').eq('id', id).single();
  if (error) throw error;
  FLE = data;
  app().innerHTML = `<a href="#/evento/${id}" class="back">${icon('back')} Volver</a>
  <div class="hero"><h1>Flyer</h1><p>Formato 4:5 para Instagram. El QR lleva directo a comprar.</p></div>
  <div class="card">
    <label style="margin-top:0">Colores</label>
    <div class="swatches">${Object.entries(PALETTES).map(([k,p])=>`<button title="${p.name}" class="${FLE.palette===k?'on':''}" style="background:linear-gradient(135deg,${p.a},${p.b})" onclick="setPal('${k}')"></button>`).join('')}</div>
    <label>Estilo</label>
    <div class="seg" id="lay">${[['bold','Gigante'],['clean','Limpio'],['ticket','Boleta']].map(([k,l])=>`<button class="${FL.layout===k?'on':''}" onclick="FL.layout='${k}';vFlyerRedraw()">${l}</button>`).join('')}</div>
    <label>Frase extra (opcional)</label><input value="${esc(FL.tag)}" placeholder="Ej: Dress code blanco · +18" oninput="FL.tag=this.value;drawFlyer()">
  </div>
  <img id="flyerOut" class="flyerimg" alt="Flyer">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="shareFlyer()">Compartir / Guardar</button><button class="btn alt" onclick="downloadFlyer()">Descargar</button></div>`;
  drawFlyer();
}
function vFlyerRedraw(){ document.querySelectorAll('#lay button').forEach((b,i)=>b.classList.toggle('on',['bold','clean','ticket'][i]===FL.layout)); drawFlyer(); }
async function setPal(k){ FLE.palette=k; document.querySelectorAll('.swatches button').forEach((b,i)=>b.classList.toggle('on',Object.keys(PALETTES)[i]===k)); drawFlyer(); await sb.from('events').update({ palette:k }).eq('id', FLE.id); }
function wrapText(x,text,maxW){ const words=String(text).split(/\s+/), lines=[]; let l=''; words.forEach(w=>{const t=l?l+' '+w:w; if(x.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t;}); if(l)lines.push(l); return lines; }
function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
let flyerCanvas = null;
async function drawFlyer(){
  const e = FLE; if (!e) return;
  try{ await document.fonts.load('800 80px "Inter Tight"'); }catch(_){}
  const p = PALETTES[e.palette]||PALETTES.neon, W=1080, H=1350;
  const c = document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const D='"Inter Tight", sans-serif', I='Inter, sans-serif';
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,p.a); g.addColorStop(1,p.c); x.fillStyle=g; x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W*.2,H*.15,10,W*.2,H*.15,W*.9); rg.addColorStop(0,p.b); rg.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=rg; x.fillRect(0,0,W,H);
  if (e.cover_url) {
    const im = await new Promise(r=>{const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>r(i); i.onerror=()=>r(null); i.src=e.cover_url;});
    if (im) { const s=Math.max(W/im.width,H/im.height); x.globalAlpha=FL.layout==='clean'?1:.6; x.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s); x.globalAlpha=1;
      const sh=x.createLinearGradient(0,H*.25,0,H); sh.addColorStop(0,'rgba(0,0,0,.1)'); sh.addColorStop(1,'rgba(0,0,0,.88)'); x.fillStyle=sh; x.fillRect(0,0,W,H); }
  }
  const txt = e.cover_url ? '#ffffff' : p.txt;
  const d = new Date(e.starts_at), o = (opt)=>d.toLocaleString('es-CO',{timeZone:TZ,...opt});
  const day=o({day:'numeric'}), mon=o({month:'long'}).toUpperCase(), wd=o({weekday:'long'}).toUpperCase(), hr=o({hour:'numeric',minute:'2-digit'}).toUpperCase();
  const name = e.name;
  x.fillStyle = txt; x.textBaseline='alphabetic';
  const fit = (t, start, min, maxLines, maxW) => { let s=start; x.font=`800 ${s}px ${D}`; let L=wrapText(x,t,maxW); while((L.length>maxLines||L.some(l=>x.measureText(l).width>maxW))&&s>min){ s-=8; x.font=`800 ${s}px ${D}`; L=wrapText(x,t,maxW);} return [s,L]; };
  if (FL.layout==='bold') {
    x.font=`600 34px ${I}`; x.fillText((e.city||'').toUpperCase()+'  ·  '+wd, 80, 130);
    const [s,L]=fit(name.toUpperCase(),190,70,4,W-160); let y=250+s*.8; L.forEach(l=>{x.fillText(l,80,y); y+=s*.92;});
    x.font=`800 250px ${D}`; x.fillText(day,80,H-260); const dw=x.measureText(day).width;
    x.font=`800 62px ${D}`; x.fillText(mon,104+dw,H-380); x.font=`600 40px ${I}`; x.fillText(hr,108+dw,H-320);
  } else if (FL.layout==='clean') {
    x.textAlign='center'; x.font=`600 36px ${I}`; x.fillText(wd+' '+day+' DE '+mon, W/2, 160);
    const [s,L]=fit(name,140,60,3,W-160); let y=H/2-((L.length-1)*s*.95)/2-60; L.forEach(l=>{x.fillText(l,W/2,y); y+=s*.95;});
    x.font=`500 38px ${I}`; x.fillText(hr, W/2, y+20); x.textAlign='left';
  } else {
    x.fillStyle='rgba(0,0,0,.35)'; rr(x,70,170,W-140,H-500,40); x.fill(); x.fillStyle=txt;
    x.font=`700 30px ${I}`; x.fillText('ADMIT ONE  ·  '+(e.city||'').toUpperCase(),120,250);
    const [s,L]=fit(name.toUpperCase(),150,60,3,W-240); let y=250+s; L.forEach(l=>{x.fillText(l,120,y); y+=s*.92;});
    x.setLineDash([18,14]); x.strokeStyle=txt; x.globalAlpha=.5; x.lineWidth=4; x.beginPath(); x.moveTo(120,H-520); x.lineTo(W-120,H-520); x.stroke(); x.setLineDash([]); x.globalAlpha=1;
    x.font=`800 64px ${D}`; x.fillText(day+' '+mon,120,H-430); x.font=`500 38px ${I}`; x.fillText(wd+'  ·  '+hr,120,H-375);
  }
  x.fillStyle=txt; x.font=`600 34px ${I}`; x.fillText('📍 '+(e.venue||''), 80, H-180);
  const minP = e.ticket_types?.length ? Math.min(...e.ticket_types.map(t=>t.price)) : 0;
  x.font=`500 30px ${I}`; x.globalAlpha=.88; x.fillText(FL.tag || ('Boletas desde '+COP(minP)), 80, H-128); x.globalAlpha=1;
  x.font=`800 30px ${D}`; x.fillText('Boletas en '+APP.toLowerCase()+' · escanea el QR', 80, H-76);
  try {
    const h=document.createElement('div');
    new QRCode(h,{ text: eventURL(e.slug, e.is_private?e.access_code:null), width:200, height:200, correctLevel:QRCode.CorrectLevel.M });
    const qc=h.querySelector('canvas'); if (qc) { x.fillStyle='#fff'; rr(x,W-300,H-310,230,230,22); x.fill(); x.drawImage(qc,W-285,H-295,200,200); }
  } catch(_){}
  flyerCanvas = c;
  try { $('flyerOut').src = c.toDataURL('image/png'); } catch(err) { $('flyerOut').src=''; toast('No se pudo usar la foto en el flyer'); }
}
async function flyerBlob(){ return new Promise(r=>flyerCanvas.toBlob(r,'image/png')); }
async function shareFlyer(){
  const b = await flyerBlob(); const f = new File([b], `flyer-${FLE.slug}.png`, { type:'image/png' });
  if (navigator.canShare && navigator.canShare({ files:[f] })) { try { await navigator.share({ files:[f], title: FLE.name }); } catch(e){} }
  else downloadFlyer();
}
async function downloadFlyer(){ const b=await flyerBlob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`flyer-${FLE.slug}.png`; a.click(); toast('Si no se descarga, mantén presionada la imagen'); }

/* ================================================================
   ESCÁNER DE ENTRADA
   ================================================================ */
async function vScan(id){
  const { data: e, error } = await sb.from('events').select('id,name').eq('id', id).single();
  if (error) throw error;
  app().innerHTML = `<a href="#/evento/${id}" class="back">${icon('back')} Volver</a>
  <div class="hero"><h1>Entrada</h1><p>${esc(e.name)}</p></div>
  <div id="reader" style="margin-top:12px"></div>
  <p class="note" id="camNote">Apunta la cámara al QR de la boleta.</p>
  <form class="card row" onsubmit="event.preventDefault();doCheck('${id}',$('man').value);$('man').value=''">
    <input id="man" placeholder="O escribe el código: CUP-XXXX-XXXX" autocapitalize="characters" style="text-transform:uppercase">
    <button class="btn sm" style="flex:none">Validar</button></form>
  <div class="card list" id="log"><p class="muted small">Aquí verás quién va entrando.</p></div>`;
  let busy = false;
  try {
    await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    const scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:240, height:240 } }, async (text)=>{
      if (busy) return; busy = true;
      await doCheck(id, text.trim());
      setTimeout(()=>busy=false, 1800);
    });
    stopScanner = () => scanner.stop();
  } catch(err) { $('camNote').textContent = 'No se pudo abrir la cámara. Dale permiso en el navegador o escribe el código.'; }
}
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function doCheck(eventId, code){
  if (!code) return;
  const { data, error } = await sb.rpc('check_in', { p_event: eventId, p_code: code });
  if (error) return toast(error.message);
  const map = { ok:['var(--ok)','✓ ADELANTE',`${esc(data.holder)} · ${esc(data.type)}`],
                used:['var(--sun)','⚠ YA ENTRÓ',`${esc(data.holder)} · ${data.at?new Date(data.at).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'numeric',minute:'2-digit'}):''}`],
                invalid:['var(--bad)','✕ NO VÁLIDA','Esta boleta no es de este evento'] };
  const [col, title, sub] = map[data.result];
  const f = document.createElement('div'); f.className='flash'; f.style.background=col; f.style.color='#0b0a10';
  f.innerHTML = `${title}<small>${sub}</small>`; document.body.appendChild(f);
  try { navigator.vibrate && navigator.vibrate(data.result==='ok'?80:[80,60,80]); } catch(e){}
  setTimeout(()=>f.remove(), 1500);
  const log = $('log'); if (log) { if (log.querySelector('p')) log.innerHTML=''; log.insertAdjacentHTML('afterbegin', `<div class="it"><span>${sub}</span><span style="color:${col}">${title.slice(2)}</span></div>`); }
}

/* ================================================================
   ADMIN — ganancias de la plataforma

let PAYS = [];
async function markPayout(i, status){
  const x = PAYS[i]; if (!x) return;
  const { error } = await sb.rpc('mark_payout', { p_id: x.id, p_status: status, p_note: $('pn_'+i)?.value || null });
  if (error) return toast(error.message);
  toast(status==='paid' ? 'Marcado como pagado ✓' : 'Retiro rechazado'); route();
}
async function vAdmin(){
  if (!profile?.is_admin) { location.hash='#/panel'; return; }
  loading();
  const [{ data, error }, { data: pays }] = await Promise.all([sb.rpc('platform_summary'), sb.rpc('admin_payouts')]);
  if (error) throw error;
  PAYS = pays || [];
  const pend = PAYS.filter(x=>x.status==='requested');
  const rows = data || []; const tot = rows.reduce((a,r)=>a+Number(r.platform_fee),0), owed = rows.reduce((a,r)=>a+Number(r.owed_to_organizer),0);
  app().innerHTML = `<a href="#/panel" class="back">${icon('back')} Perfil</a>
  <div class="hero"><h1>Plataforma</h1><p>Lo que ganas con el cargo por servicio (8%) y los retiros que debes transferir.</p></div>
  <div class="stat" style="margin-top:12px"><div class="card"><small>Tu ganancia (cargo por servicio)</small><div class="n" style="color:var(--sun)">${COP(tot)}</div></div>
  <div class="card"><small>Retiros por pagar</small><div class="n">${COP(pend.reduce((a,x)=>a+x.amount,0))}</div></div></div>
  <div class="sec"><h3>Retiros pendientes (${pend.length})</h3>
  ${pend.length ? pend.map(x=>{ const a=x.account||{}; const i=PAYS.indexOf(x); return `<div class="card">
    <div class="row"><b style="font-size:20px">${COP(x.amount)}</b><span class="small muted" style="text-align:right">${new Date(x.requested_at).toLocaleString('es-CO',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</span></div>
    <div class="small muted" style="margin-top:4px;overflow-wrap:anywhere">${esc(x.host)} · ${esc(x.email)}</div>
    <div class="list" style="margin-top:8px">
      <div class="it"><span class="muted">Titular</span><b>${esc(a.holder_name)}</b></div>
      <div class="it"><span class="muted">Documento</span><b>${esc(a.doc_type)} ${esc(a.doc_number)}</b></div>
      <div class="it"><span class="muted">Banco</span><b>${esc(a.bank)} · ${ACC_TYPES[a.account_type]||''}</b></div>
      <div class="it"><span class="muted">Número</span><span><b class="code">${esc(a.account_number)}</b> <a href="#" class="small" onclick="copy('${esc(a.account_number)}');return false">Copiar</a></span></div>
    </div>
    <label for="pn_${i}">Nota (por ejemplo, número de la transferencia)</label><input id="pn_${i}" placeholder="Opcional">
    <div class="row" style="margin-top:10px"><button class="btn" onclick="markPayout(${i},'paid')">${icon('check')} Ya le transferí</button><button class="btn alt" style="flex:.6" onclick="markPayout(${i},'rejected')">Rechazar</button></div>
  </div>`}).join('') : '<p class="muted small">No hay retiros pendientes.</p>'}
  ${PAYS.filter(x=>x.status!=='requested').length?`<div class="card list">${PAYS.filter(x=>x.status!=='requested').map(x=>`<div class="it"><span>${esc(x.host)}<br><span class="small muted">${x.paid_at?new Date(x.paid_at).toLocaleDateString('es-CO',{timeZone:TZ,day:'numeric',month:'short'}):''}${x.note?' · '+esc(x.note):''}</span></span><span style="text-align:right">${COP(x.amount)}<br><span class="badge ${x.status==='paid'?'on':''}">${x.status==='paid'?'Pagado':'Rechazado'}</span></span></div>`).join('')}</div>`:''}
  </div>
  <div class="sec"><h3>Por evento</h3></div>
  <div class="card tablewrap"><table><tr><th>Evento</th><th>Boletas</th><th>Cargo Cupo</th><th>Al organizador</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.event)}<br><span class="muted">${esc(r.owner||'')}</span></td><td>${r.tickets}</td><td>${COP(r.platform_fee)}</td><td>${COP(r.owed_to_organizer)}</td></tr>`).join('')}</table></div>`;
}
